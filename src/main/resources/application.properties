spring.application.name=pedidos-service

# H2 en memoria. MODE=LEGACY habilita la función IDENTITY() que usa el código de
# partida (CALL IDENTITY()); H2 2.x la eliminó del modo por defecto.
spring.datasource.url=jdbc:h2:mem:pedidos;MODE=LEGACY;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# schema.sql y data.sql se ejecutan al arrancar
spring.sql.init.mode=always

server.port=8080
